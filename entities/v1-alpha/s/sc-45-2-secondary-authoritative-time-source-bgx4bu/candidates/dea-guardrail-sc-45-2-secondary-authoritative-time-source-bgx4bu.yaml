id: dea:guardrail-sc-45-2-secondary-authoritative-time-source-bgx4bu
type: Guardrail
name: SC-45.2 — Secondary Authoritative Time Source
description: (a) Identify a secondary authoritative time source that is in a different
  geographic region than the primary authoritative time source; and (b) Synchronize
  the internal system clocks to the secondary authoritative time source if the primary
  authoritative time source is unavailable.
