type: Guardrail
name: SA-17.5 — Conceptually Simple Design
description: (a) Design and structure the security-relevant hardware, software, and
  firmware to use a complete, conceptually simple protection mechanism with precisely
  defined semantics; and (b) Internally structure the security-relevant hardware,
  software, and firmware with specific regard for this mechanism.
