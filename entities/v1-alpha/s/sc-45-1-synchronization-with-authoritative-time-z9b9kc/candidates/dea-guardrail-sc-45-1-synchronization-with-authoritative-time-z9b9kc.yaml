type: Guardrail
name: SC-45.1 — Synchronization with Authoritative Time Source
description: (a) Compare the internal system clocks organization-defined with organization-defined
  ; and (b) Synchronize the internal system clocks to the authoritative time source
  when the time difference is greater than organization-defined.
