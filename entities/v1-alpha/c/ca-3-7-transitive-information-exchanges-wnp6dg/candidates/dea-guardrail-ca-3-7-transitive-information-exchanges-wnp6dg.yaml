id: dea:guardrail-ca-3-7-transitive-information-exchanges-wnp6dg
type: Guardrail
name: CA-3.7 — Transitive Information Exchanges
description: (a) Identify transitive (downstream) information exchanges with other
  systems through the systems identified in (#ca-3_smt.a) ; and (b) Take measures
  to ensure that transitive (downstream) information exchanges cease when the controls
  on identified transitive (downstream) systems cannot be verified or validated.
