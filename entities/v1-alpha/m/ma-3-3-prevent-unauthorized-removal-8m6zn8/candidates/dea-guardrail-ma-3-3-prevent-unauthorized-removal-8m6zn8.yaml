id: dea:guardrail-ma-3-3-prevent-unauthorized-removal-8m6zn8
type: Guardrail
name: MA-3.3 — Prevent Unauthorized Removal
description: (a) Verifying that there is no organizational information contained on
  the equipment; (b) Sanitizing or destroying the equipment; (c) Retaining the equipment
  within the facility; or (d) Obtaining an exemption from organization-defined explicitly
  authorizing removal of the equipment from the facility.
