name: AU-8 — Time Stamps
description: a. Use internal system clocks to generate time stamps for audit records; and b. Record time
  stamps for audit records that meet organization-defined and that use Coordinated Universal Time, have
  a fixed local time offset from Coordinated Universal Time, or that include the local time offset as
  part of the time stamp.
