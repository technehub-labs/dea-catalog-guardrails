name: MA-4.3 — Comparable Security and Sanitization
description: (a) Require that nonlocal maintenance and diagnostic services be performed from a system
  that implements a security capability comparable to the capability implemented on the system being serviced;
  or (b) Remove the component to be serviced from the system prior to nonlocal maintenance or diagnostic
  services; sanitize
